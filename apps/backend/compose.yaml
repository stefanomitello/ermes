services:
  mongodb:
    image: mongo:7-jammy
    container_name: ermes-mongodb
    restart: unless-stopped
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_DATABASE: ermes
    volumes:
      - mongodb-data:/data/db
    networks:
      - ermes-network

  backend:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: backend
    container_name: ermes-backend
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - ../../.env
    environment:
      NODE_ENV: production
      BACKEND_PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/ermes
      CLERK_JWT_KEY: ${CLERK_JWT_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-ermes-development-secret-key-min-32-chars}
    depends_on:
      - mongodb
    networks:
      - ermes-network

networks:
  ermes-network:
    name: ermes-network
    driver: bridge

volumes:
  mongodb-data:
    name: ermes-mongodb-data
