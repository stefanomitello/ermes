services:
  frontend:
    build:
      context: ../..
      dockerfile: apps/frontend/Dockerfile
      target: frontend
      args:
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:-${CLERK_PUBLISHABLE_KEY:-}}
        CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:-}
    container_name: ermes-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    environment:
      NODE_ENV: production
      BACKEND_URL: http://backend:3000
    depends_on:
      - backend
    networks:
      - ermes-network

networks:
  ermes-network:
    name: ermes-network
    driver: bridge
